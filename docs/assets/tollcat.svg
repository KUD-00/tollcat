  <!-- TollCat 定稿造型 —— 这是「图层库」不是一张成品插画。
       所有图层叠在一起看会很乱,那是正常的:App 按命名表情组合其中几层
       (silhouette + tail + 一种 eye + 一种 mouth [+ glasses])。
       颜色由代码给:body 浅 #6E747B / 深 #858C93；ink #FFFFFF(白眼白嘴)。
       SVG 里的 fill 是浅色参考，运行时按 color scheme 上色。
       耳朵与身体是同一条闭合路径(silhouette),没有接缝。动耳朵只拧这条路径上耳尖的控制点。
       只用 M L C A Z、纯填充闭合路径。glasses 用 fill-rule="evenodd" 挖空镜片。
       表情是命名组合,不是自由搭配 —— 见 docs/DESIGN-BAR.md。 -->
