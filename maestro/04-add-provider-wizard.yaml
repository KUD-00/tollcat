# 空库：从服务空态进添加目录，选 Cloudflare，确认，走到填凭据那一步。
# 不填凭据、不点「测试连接」——那要打真网络，不是冒烟该做的事。
appId: com.zhechengqi.tollcat
---
- launchApp:
    clearState: true
    arguments:
      -skip-onboarding: true
      -skip-demo-seed: true
      -clock-preset=design: true
      # 目录已有五百多家，按分组再按字母排，Cloudflare 离首屏很远；靠滚动找它
      # 会在 speed 40 一屏一屏地跳时错过。iOS 用启动参数把搜索词预置好，
      # 列表只剩几行；Android 没有这个参数，仍靠下面放慢的滚动。
      -add-search=Cloudflare: true
      skip_onboarding: true
      clock_preset: design
# 首次冷启动（Android 要解压 Swift 资源包）十几秒，默认等待不够。
- extendedWaitUntil:
    visible:
      id: tab.services
    timeout: 60000
- tapOn:
    id: tab.services
- tapOn:
    id: services.empty.add
- assertVisible:
    id: addProvider.list
# iOS 已经被搜索词过滤到首屏；Android 还得滚。放慢速度，免得一次滑过一整屏把它跳过去。
- scrollUntilVisible:
    element:
      id: addProvider.row.cloudflare
    direction: DOWN
    speed: 15
    timeout: 90000
- tapOn:
    id: addProvider.row.cloudflare
- tapOn:
    id: addProvider.confirm
# 两端确认后都先落到这家的详情页，向导从「连接 X 账单」弹出。
- assertVisible:
    id: providerDetail.list
- tapOn:
    id: providerDetail.connect
# Android 的向导多一步「介绍」，先多按一次主按钮才到连接参考。
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: setup.next
- assertVisible:
    id: setup.guide
- tapOn:
    id: setup.next
- assertVisible:
    id: setup.credentials
