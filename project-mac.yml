# XcodeGen 工程定义（macOS 直发版）。TollCatMac.xcodeproj 是它的生成物,不要手工编辑后者。
#   nix shell nixpkgs#xcodegen -c xcodegen generate --spec project-mac.yml
#
# 独立一份工程，不和 iOS 挤在 `project.yml` 里：SPM 的包解析是工程级的，
# Sparkle 只要写进那一份，iOS 构建也会先 fetch / checkout 一遍它永远不链的东西。
# 这里是全仓库唯一出现第三方包的 spec（`check-source-invariants.py` 按这条扫）。
#
# 共用的选项和 base settings 在 `project-common.yml`。
# 想在 Xcode 里和 iOS 那份同时打开，走 `TollCat.xcworkspace`（理由见 project.yml 顶上）。
# 组装复用 App/AppEnvironment.swift；不要把 Mac 和 iOS 糊成 supportedDestinations
# ——沙盒和 App Group 前缀两边不是一份。
#
# 拆成两份工程不影响商店身份：App Store 认「同一个 app」看的是 bundle id + 团队 +
# App Store Connect 上那条记录，和仓库里有几个 .xcodeproj 无关。所以 `TollCatMac`
# 的 PRODUCT_BUNDLE_IDENTIFIER 必须和 iOS 那份一模一样（通用购买的硬条件），
# widget 的也一样。改这里之前先想清楚这件事。
#
# 这份 spec 里有两个 Mac 壳，同一份源码、同一个 bundle id，走两条发布线：
#   TollCatMac          直发版，链 Sparkle，Developer ID 签名 + 公证（release.yml 的 mac job）
#   TollCatMacAppStore  商店版，不链 Sparkle，Apple Distribution 签名（mac-appstore job）
# 商店不许带第三方更新器，细节见 TollCatMacAppStore 那一段的注释。
# 界面不用改——「检查更新…」靠注入的 `AppUpdateChecker`，不挂它入口自动消失
# （见 AboutView / TollCatCommands）。

name: TollCatMac

include:
  - project-common.yml

options:
  deploymentTarget:
    macOS: "26.0"

packages:
  # Mac 直发版的自动更新。这是全仓库唯一的第三方依赖，只链进 TollCatMac，
  # 不进 MeterKit、不进 iOS 工程（AGENTS.md「不要引入第三方库」的唯一例外）。
  # 版本钉死到补丁号，和 .github/workflows/release.yml 里下载的签名工具是同一个发行版。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:

  # ─────────────────────────────────────────────────────────────
  # macOS 壳。
  TollCatMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: App/AppEnvironment.swift
      - path: App/PersistenceBootstrap.swift
      - path: App/StampedBillingProvider.swift
      - path: TollCat.storekit
        buildPhase: resources
        type: file
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/Localizable.xcstrings
      - path: App/Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Mac/TollCatMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.zhechengqi.tollcat
        # Keychain Sharing 在这里不是为了共享：它是唯一能逼自动签名给 Mac 壳
        # 嵌 provisioning profile 的 capability。没有 profile，这一代 macOS 的
        # secd 会整个忽略 app-groups entitlement，数据保护 Keychain 全部 -34018，
        # 且 $(AppIdentifierPrefix) 展开为空、App Group 容器落到没前缀的路径。
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.zhechengqi.tollcat
        # Sparkle 在沙盒里装更新要经它自带的两个 XPC 服务（安装启动器 -spks、
        # 安装器 -spki）。沙盒进程默认连不上别的 mach 服务，这是 Apple 给这类
        # 场景留的临时例外，名字必须是 bundle id 加这两个后缀。
        # 没有下载器服务的例外（-spkd）：App 已有 network.client，Sparkle 自己下载。
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    dependencies:
      - package: MeterKit
        products: [MeterFeatures, MeterPersistence, MeterProviders, MeterDesign, MeterCore, MeterTips, MeterInbox, MeterFeedback, MeterUsage]
      - package: Sparkle
      - target: TollCatWidgetMac
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhechengqi.tollcat
        PRODUCT_NAME: TollCat
        GENERATE_INFOPLIST_FILE: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: TollCat
        INFOPLIST_KEY_CFBundleLocalizations: "en ja zh-Hans"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Mac/Supporting-Info.plist

  # ─────────────────────────────────────────────────────────────
  # Mac App Store 版。和 TollCatMac 同一份源码、同一个 bundle id，只差三处：
  # 不链 Sparkle、entitlements 没有那两条 mach-lookup 例外、Info.plist 没有 SU* 键。
  #
  # 为什么必须另开一个 target 而不是复用 TollCatMac：Sparkle 框架里带四个自己的
  # 可执行文件（Autoupdate、Updater.app、Downloader.xpc、Installer.xpc），它们没有
  # app-sandbox entitlement。MAS 要求 bundle 里**每一个**可执行文件都带沙盒，所以
  # 拿 TollCatMac 归的档提交会被整包退回：
  #   "App sandbox not enabled. The following executables must include the
  #    com.apple.security.app-sandbox entitlement..."（2026-09-12 实测）
  # 这不是补 entitlement 能修的——商店本来就不许带第三方更新器。
  #
  # 界面一行都不用改：MacUpdater.swift 的 `#if canImport(Sparkle)` 在这里为假，
  # checker 退成 nil，「检查更新…」入口自己消失（见 AboutView / TollCatCommands）。
  TollCatMacAppStore:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: App/AppEnvironment.swift
      - path: App/PersistenceBootstrap.swift
      - path: App/StampedBillingProvider.swift
      - path: TollCat.storekit
        buildPhase: resources
        type: file
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/Localizable.xcstrings
      - path: App/Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Mac/TollCatMacAppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.zhechengqi.tollcat
        # 和直发版同一个 group / access group：容器路径一样，用户从直发版换装
        # 商店版，数据和钥匙串里的凭据都还在。
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.zhechengqi.tollcat
        # 这里**没有** com.apple.security.temporary-exception.mach-lookup.global-name。
        # 那两条是给 Sparkle 的 XPC 服务开的，商店版不链 Sparkle 就不需要；
        # temporary-exception 这一类 entitlement 在 MAS 审核里必被问，留着是自曝。
    dependencies:
      - package: MeterKit
        products: [MeterFeatures, MeterPersistence, MeterProviders, MeterDesign, MeterCore, MeterTips, MeterInbox, MeterFeedback, MeterUsage]
      - target: TollCatWidgetMac
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhechengqi.tollcat
        PRODUCT_NAME: TollCat
        GENERATE_INFOPLIST_FILE: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: TollCat
        INFOPLIST_KEY_CFBundleLocalizations: "en ja zh-Hans"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Mac/AppStore-Info.plist

  TollCatWidgetMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - TollCatWidget.entitlements
    entitlements:
      path: Mac/TollCatWidgetMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.zhechengqi.tollcat
    dependencies:
      - package: MeterKit
        products: [MeterDesign, MeterFormat, MeterModules, MeterPersistence, MeterCore]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: TollCat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 少了这一列，扩展进程只认开发语言 zh-Hans。Bundle 里的字照样按
        # AppleLanguages 选到英文，但 `Locale.current` 被钉在中文——
        # DateIntervalFormatter 于是在英文系统上把统计区间印成「9月1日至6日」。
        # App target 走 INFOPLIST_KEY_CFBundleLocalizations，扩展这份得自己列。
        CFBundleLocalizations: [zh-Hans, en, ja]
        # MeterPersistence 拼 Mac App Group id 用。
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhechengqi.tollcat.widget
        SKIP_INSTALL: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  TollCatMac:
    build:
      targets:
        TollCatMac: all
        TollCatWidgetMac: all
    run:
      config: Debug
      storeKitConfiguration: TollCat.storekit

  TollCatMacAppStore:
    build:
      targets:
        TollCatMacAppStore: all
        TollCatWidgetMac: all
    run:
      config: Debug
      storeKitConfiguration: TollCat.storekit
