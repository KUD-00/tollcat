name: Android debug APK

# On demand only: a sideloadable build to hand to a tester.
#   gh workflow run android-debug-apk.yml --ref <branch-or-tag>
#   gh run download <run-id> --name tollcat-debug-apk
# Signed with the runner's throwaway debug key, so it cannot upgrade a Play
# install (and successive builds may not upgrade each other): uninstall first.
# Toolchain steps mirror the Android job in ci.yml; change them together.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SWIFT_VERSION: 6.3.3
      ANDROID_SDK_CHECKSUM: d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
      NDK_VERSION: 27.3.13750724
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"

      - name: Install Swift and the Android SDK bundle
        run: |
          set -euo pipefail
          # swiftly exits 1 after installing the toolchain when this is missing;
          # the ubuntu-24.04 runner image stopped shipping it.
          sudo apt-get update -q
          sudo apt-get install -y -q libcurl4-openssl-dev
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/swiftly" init --assume-yes --skip-install --quiet-shell-followup
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install "$SWIFT_VERSION" --use
          swift --version
          # Remote bundles need --checksum. Value from swift.org/api/v1/install/releases.json
          # (6.3.3 → "Android SDK"); bump it together with SWIFT_VERSION.
          swift sdk install --checksum "${ANDROID_SDK_CHECKSUM}" \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/android-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle.tar.gz"
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Cross-compile MeterCore and stage jniLibs
        run: |
          set -euo pipefail
          # ANDROID_HOME is the runner's shell variable, not part of the workflow
          # env context, so reading it through the env expression gave an empty prefix.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          . "$HOME/.local/share/swiftly/env.sh"
          # Where swift sdk install puts bundles moved between toolchains
          # (~/.swiftpm vs the XDG config dir); find it instead of assuming.
          SDK_BUNDLE="$(find "$HOME" -type d -path "*/swift-sdks/swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle/swift-android" -print -quit)"
          [[ -n "$SDK_BUNDLE" ]] || { echo "Android Swift SDK bundle not found under $HOME" >&2; exit 1; }
          echo "SDK_BUNDLE=$SDK_BUNDLE"
          export SDK_BUNDLE
          bash scripts/android-run.sh --build-only

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd Android
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tollcat-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
